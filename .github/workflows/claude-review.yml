name: Claude Code Review

# Requires repo secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`
# locally if you have a Claude Pro/Max subscription) or ANTHROPIC_API_KEY.
# Also install the Claude GitHub App: https://github.com/apps/claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a code review with the following focus areas:

            1. **Code Quality** - clean code principles, error handling,
               edge cases, readability and maintainability.
            2. **Security** - secrets/credentials committed anywhere,
               input validation, auth/authorization logic.
            3. **Performance** - potential bottlenecks, inefficient
               queries or I/O.
            4. **Testing** - adequate coverage for new/changed code,
               test quality and edge cases.
            5. **Documentation** - new code reasonably documented,
               README/CHANGELOG updated for user-facing changes.

            Provide detailed feedback using inline comments for specific
            issues. Use top-level comments for general observations.
            Adjust these focus areas to fit the actual project (e.g. a
            content-only repo needs a very different review lens - see
            AGENTS.md for this repo's specifics).

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
