name: CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - "packages/**"
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Metro/Hermes bundling only — no Android SDK or Xcode is involved. Both
      # platforms run in this job so the second export reuses the warm Metro
      # transform cache instead of paying for a second checkout and `npm ci`.
      - name: Verify Android Expo export
        run: npm run export:android --workspace @codigdex/mobile
        env:
          CI: "true"
      - name: Verify iOS Expo export
        run: npm run export:ios --workspace @codigdex/mobile
        env:
          CI: "true"
      - run: npm run build:web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
