appId: com.codingnanyong.codigdex
name: COD-236 native startup, save and quiz recovery
tags:
  - cod-236
---
- runFlow: ../helpers/start.yaml
- scrollUntilVisible:
    element:
      id: qa-fail-save
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: qa-fail-save
- scrollUntilVisible:
    element:
      id: qa-retry-save
    direction: DOWN
    timeout: 20000
- tapOn:
    id: qa-retry-save
- scrollUntilVisible:
    element:
      id: qa-save-status
    direction: UP
    timeout: 20000
- assertVisible:
    id: qa-save-status
    text: SAVED
- assertVisible:
    id: qa-locale
    text: ko
- scrollUntilVisible:
    element:
      id: qa-fail-quiz
    direction: DOWN
    timeout: 20000
- tapOn:
    id: qa-fail-quiz
- scrollUntilVisible:
    element:
      id: qa-tutorial
    direction: UP
    timeout: 20000
- tapOn:
    id: qa-tutorial
- assertVisible:
    id: battle-load-error
- scrollUntilVisible:
    element:
      id: battle-retry-load
    direction: DOWN
    timeout: 20000
- tapOn:
    id: battle-retry-load
- assertVisible:
    id: battle-prompt
- scrollUntilVisible:
    element:
      id: battle-exit
    direction: UP
    timeout: 20000
- tapOn:
    id: battle-exit
- scrollUntilVisible:
    element:
      id: world-menu
    direction: UP
    timeout: 20000
- tapOn:
    id: world-menu
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-title
    timeout: 90000
- scrollUntilVisible:
    element:
      id: home-qa
    direction: DOWN
    timeout: 20000
- tapOn:
    id: home-qa
- assertVisible:
    id: qa-locale
    text: ko
- assertVisible:
    id: qa-save-status
    text: SAVED
- takeScreenshot: cod-236-recovery
