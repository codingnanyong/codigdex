appId: com.codingnanyong.codigdex
name: COD-235 real mixed quiz, blank input and two hints
tags:
  - cod-235
---
- runFlow: ../helpers/start.yaml
- scrollUntilVisible:
    element:
      id: qa-tutorial
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: qa-tutorial
- scrollUntilVisible:
    element:
      id: battle-choice-0
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: battle-choice-0
- scrollUntilVisible:
    element:
      id: battle-feedback
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: battle-feedback
    text: CORRECT!
- scrollUntilVisible:
    element:
      id: battle-next
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: battle-next
- scrollUntilVisible:
    element:
      id: battle-submit
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: battle-submit
    enabled: false
- scrollUntilVisible:
    element:
      id: battle-hint
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: battle-hint
