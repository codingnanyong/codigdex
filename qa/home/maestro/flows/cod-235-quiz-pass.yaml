    element:
      id: battle-hint
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: battle-hint
- scrollUntilVisible:
    element:
      id: battle-hint-2
    direction: UP
    timeout: 20000
    centerElement: true
- assertVisible:
    id: battle-hint-2
- scrollUntilVisible:
    element:
      id: battle-hint
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: battle-hint
    enabled: false
- scrollUntilVisible:
    element:
      id: battle-answer
    direction: UP
    timeout: 20000
    centerElement: true
- tapOn:
    id: battle-answer
- inputText: while
- scrollUntilVisible:
    element:
      id: battle-submit
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: battle-submit
- scrollUntilVisible:
    element:
      id: battle-feedback
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: battle-feedback
    text: CORRECT!
- scrollUntilVisible:
