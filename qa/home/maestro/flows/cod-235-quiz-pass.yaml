      id: battle-damage
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: battle-damage
    text: 2 hints · attack strength 50%
- scrollUntilVisible:
    element:
      id: battle-next
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: battle-next
- assertVisible:
    id: result-title
    text: CAPTURED
- scrollUntilVisible:
    element:
      id: result-qa
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: result-qa
- assertVisible:
    id: qa-captures
    text: "1"
- assertVisible:
    id: qa-save-status
    text: SAVED
- takeScreenshot: cod-235-pass
