appId: com.codingnanyong.codigdex
name: COD-238 request-history save failure, retry, restart and decline
tags:
  - cod-238
  - encounters
---
- runFlow: ../helpers/start.yaml
- scrollUntilVisible:
    element:
      id: qa-start-encounter:frontend
    direction: DOWN
    timeout: 60000
    speed: 20
- tapOn:
    id: qa-start-encounter:frontend
- scrollUntilVisible:
    element:
      id: home-qa
    direction: DOWN
    timeout: 60000
    speed: 20
- tapOn:
    id: home-qa
- scrollUntilVisible:
    element:
      id: qa-fail-source-save
    direction: DOWN
    timeout: 60000
    speed: 20
- tapOn:
    id: qa-fail-source-save
- scrollUntilVisible:
    element:
      id: qa-menu
    direction: UP
    timeout: 60000
    speed: 20
- tapOn:
    id: qa-menu
- scrollUntilVisible:
    element:
      id: home-play
    direction: DOWN
    timeout: 60000
    speed: 20
- tapOn:
    id: home-play
- scrollUntilVisible:
    element:
      id: career-checkpoint-structure-sprout
    direction: DOWN
    timeout: 60000
    speed: 20
- tapOn:
    id: career-checkpoint-structure-sprout
- scrollUntilVisible:
