    text: CORRECT!
- scrollUntilVisible:
    element:
      id: battle-next
    direction: DOWN
    timeout: 60000
    speed: 20
- tapOn:
    id: battle-next
- scrollUntilVisible:
    element:
      id: battle-choice-3
    direction: DOWN
    timeout: 60000
    speed: 20
- tapOn:
    id: battle-choice-3
- scrollUntilVisible:
    element:
      id: battle-feedback
    direction: DOWN
    timeout: 60000
    speed: 20
- assertVisible:
    id: battle-feedback
    text: CORRECT!
- scrollUntilVisible:
    element:
      id: battle-next
    direction: DOWN
    timeout: 60000
    speed: 20
- tapOn:
    id: battle-next
- assertVisible:
    id: result-title
    text: CAPTURED
- scrollUntilVisible:
    element:
      id: result-world
    direction: DOWN
    timeout: 60000
    speed: 20
- tapOn:
