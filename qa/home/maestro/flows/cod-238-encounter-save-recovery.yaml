- scrollUntilVisible:
    element:
      id: source-event-retry-save
    direction: DOWN
    timeout: 60000
    speed: 20
- tapOn:
    id: source-event-retry-save
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-title
    timeout: 90000
- scrollUntilVisible:
    element:
      id: home-play
    direction: DOWN
    timeout: 60000
    speed: 20
- tapOn:
    id: home-play
- assertVisible:
    id: source-event-tool
    text: TanStack Query
- scrollUntilVisible:
    element:
      id: source-event-later
    direction: DOWN
    timeout: 60000
    speed: 20
- tapOn:
    id: source-event-later
- assertVisible:
    id: career-title
- scrollUntilVisible:
    element:
      id: career-menu
    direction: UP
    timeout: 60000
    speed: 20
- tapOn:
    id: career-menu
- scrollUntilVisible:
