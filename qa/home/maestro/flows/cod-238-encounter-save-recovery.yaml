      id: home-qa
    direction: DOWN
    timeout: 60000
    speed: 20
- tapOn:
    id: home-qa
- assertVisible:
    id: qa-captures
    text: "12"
- assertVisible:
    id: qa-save-status
    text: SAVED
- takeScreenshot: cod-238-request-save-recovered
