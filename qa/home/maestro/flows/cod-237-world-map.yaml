appId: com.codingnanyong.codigdex
name: COD-237 locked regions and tutorial to Git unlock
tags:
  - cod-237
---
- runFlow: ../helpers/start.yaml
- scrollUntilVisible:
    element:
      id: qa-world
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: qa-world
- assertVisible:
    id: world-title
- scrollUntilVisible:
    element:
      id: world-region-linux
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: world-region-linux
- scrollUntilVisible:
    element:
      id: world-battle
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: world-battle
    enabled: false
- assertVisible:
    id: world-locked
- scrollUntilVisible:
    element:
      id: world-menu
    direction: UP
    timeout: 20000
    centerElement: true
- tapOn:
    id: world-menu
- scrollUntilVisible:
    element:
      id: home-qa
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: home-qa
- scrollUntilVisible:
    element:
      id: qa-preset-tutorial
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: qa-preset-tutorial
- scrollUntilVisible:
    element:
      id: qa-save-status
    direction: UP
    timeout: 20000
    centerElement: true
- assertVisible:
    id: qa-save-status
    text: SAVED
- assertVisible:
    id: qa-checkpoint
    text: git-sprout
- scrollUntilVisible:
    element:
      id: qa-world
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: qa-world
- scrollUntilVisible:
    element:
      id: world-checkpoint-git-sprout
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: world-checkpoint-git-sprout
- scrollUntilVisible:
    element:
      id: world-battle
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: world-battle
- assertVisible:
    id: battle-prompt
- takeScreenshot: cod-237-git
